<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doc's Name 5 Challenge</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ==============================
   MAIN VERTICAL TIKTOK SCREEN
   ============================== */

#game {
    position: relative;
    height: 100vh;
    aspect-ratio: 9 / 16;
    max-width: 100vw;
    overflow: hidden;
    background: #000;
}

/* Background graphic */

#backgroundImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}


/* ==============================
   LIVE TIMER
   ============================== */

#timerBox {
    position: absolute;

    left: 31%;
    top: 59.2%;

    width: 38%;
    height: 11%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #050505;

    border: 4px solid #22e7ff;
    border-radius: 18px;

    box-shadow:
        0 0 8px #22e7ff,
        0 0 18px #22e7ff,
        0 0 28px rgba(34,231,255,.65);

    z-index: 10;
}

#timer {
    color: #ffffff;

    font-family: "Courier New", monospace;

    font-size: clamp(38px, 10vw, 76px);

    font-weight: 900;

    line-height: 1;

    letter-spacing: 1px;

    text-shadow:
        0 0 5px #fff,
        0 0 10px rgba(255,255,255,.5);
}


/* ==============================
   3 - 2 - 1 - GO
   ============================== */

#intro {
    position: absolute;
    inset: 0;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.70);

    color: #ffe600;

    font-size: clamp(90px, 30vw, 200px);

    font-weight: 1000;

    text-align: center;

    text-shadow:
        5px 5px 0 #e60000,
        8px 8px 0 #000,
        0 0 25px #ffe600;

    z-index: 30;
}


/* ==============================
   TIME'S UP
   ============================== */

#timesUp {
    position: absolute;
    inset: 0;

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 25px;

    background: rgba(0,0,0,.84);

    z-index: 40;
}

#timesUpTitle {
    color: #ffe600;

    font-size: clamp(58px, 16vw, 105px);

    font-weight: 1000;

    line-height: .95;

    text-shadow:
        5px 5px 0 #e60000,
        8px 8px 0 #000;
}

#timesUpText {
    margin-top: 30px;

    color: #fff;

    font-size: clamp(22px, 6vw, 38px);

    font-weight: 900;

    line-height: 1.35;
}

#timesUpText span {
    color: #ffe600;
}

#restartMessage {
    margin-top: 35px;

    color: #22e7ff;

    font-size: clamp(18px, 5vw, 28px);

    font-weight: 900;
}

</style>
</head>


<body>

<div id="game">

    <!-- BACKGROUND -->

    <img
        id="backgroundImage"
        src="a_vibrant_colorful_game_show_style_vertical_poste.png"
        alt="Doc's Name 5 Challenge"
    >


    <!-- LIVE ONE-MINUTE TIMER -->

    <div id="timerBox">

        <div id="timer">
            01:00
        </div>

    </div>


    <!-- 3 2 1 GO -->

    <div id="intro">
        3
    </div>


    <!-- TIME'S UP SCREEN -->

    <div id="timesUp">

        <div id="timesUpTitle">
            TIME'S<br>UP!
        </div>

        <div id="timesUpText">

            How many did you get?

            <br><br>

            <span>
                PUT YOUR 5 IN THE COMMENTS!
            </span>

        </div>

        <div id="restartMessage">
            NEXT ROUND STARTING...
        </div>

    </div>

</div>


<script>

/* ==========================================
   DOC'S NAME 5 CHALLENGE
   ONE-MINUTE AUTOMATIC TIMER
   ========================================== */


/*
   ONLY TIMER SETTING

   60 seconds = 1 minute
*/

const CHALLENGE_SECONDS = 60;


/*
   Time's Up screen stays
   visible for 5 seconds.
*/

const RESULTS_SECONDS = 5;


/* Get screen elements */

const timer =
    document.getElementById("timer");

const timerBox =
    document.getElementById("timerBox");

const intro =
    document.getElementById("intro");

const timesUp =
    document.getElementById("timesUp");


/* ==========================================
   WAIT FUNCTION
   ========================================== */

function wait(milliseconds) {

    return new Promise(resolve => {

        setTimeout(resolve, milliseconds);

    });

}


/* ==========================================
   TIMER DISPLAY

   60 becomes 01:00
   59 becomes 00:59
   5 becomes 00:05
   0 becomes 00:00
   ========================================== */

function updateTimer(totalSeconds) {

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;

    const formattedMinutes =
        String(minutes).padStart(2, "0");

    const formattedSeconds =
        String(seconds).padStart(2, "0");

    timer.textContent =
        formattedMinutes +
        ":" +
        formattedSeconds;

}


/* ==========================================
   INTRO
   ========================================== */

async function playIntro() {

    timesUp.style.display = "none";

    timerBox.style.display = "flex";

    updateTimer(CHALLENGE_SECONDS);

    intro.style.display = "flex";


    intro.textContent = "3";

    await wait(700);


    intro.textContent = "2";

    await wait(700);


    intro.textContent = "1";

    await wait(700);


    intro.textContent = "GO!";

    await wait(700);


    intro.style.display = "none";

}


/* ==========================================
   ONE-MINUTE COUNTDOWN
   ========================================== */

async function playCountdown() {

    /*
       Begin at exactly 01:00
    */

    updateTimer(CHALLENGE_SECONDS);


    /*
       Wait one second before
       changing 01:00 to 00:59.
    */

    await wait(1000);


    for (
        let remaining = CHALLENGE_SECONDS - 1;
        remaining >= 0;
        remaining--
    ) {

        updateTimer(remaining);


        /*
           Pulse during final
           five seconds.
        */

        if (
            remaining <= 5 &&
            remaining > 0
        ) {

            timerBox.animate(

                [
                    {
                        transform: "scale(1)"
                    },

                    {
                        transform: "scale(1.08)"
                    },

                    {
                        transform: "scale(1)"
                    }
                ],

                {
                    duration: 450
                }

            );

        }


        /*
           Keep each number visible
           for one full second.
        */

        if (remaining > 0) {

            await wait(1000);

        }

    }


    /*
       Let 00:00 show briefly.
    */

    await wait(500);

}


/* ==========================================
   TIME'S UP SCREEN
   ========================================== */

async function showTimesUp() {

    timesUp.style.display = "flex";

    await wait(
        RESULTS_SECONDS * 1000
    );

    timesUp.style.display = "none";

}


/* ==========================================
   AUTOMATIC CONTINUOUS LOOP
   ========================================== */

async function runGame() {

    while (true) {

        /*
           3 - 2 - 1 - GO!
        */

        await playIntro();


        /*
           01:00 countdown
        */

        await playCountdown();


        /*
           TIME'S UP
        */

        await showTimesUp();

    }

}


/* ==========================================
   START AUTOMATICALLY
   ========================================== */

window.addEventListener(
    "load",
    function () {

        runGame();

    }
);

</script>

</body>
</html>
